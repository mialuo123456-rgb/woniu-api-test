name: API Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  # 手动触发
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r woniu_api_test/requirements.txt

    - name: Run API tests
      working-directory: woniu_api_test
      run: |
        pytest -v --tb=short --junitxml=reports/test-results.xml --html=reports/report.html --self-contained-html 2>/dev/null || pytest -v --tb=short --junitxml=reports/test-results.xml
      continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          woniu_api_test/reports/test-results.xml
          woniu_api_test/reports/report.html

    - name: Post test summary
      if: always()
      run: |
        echo "## 测试结果摘要" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
        echo "| 执行时间 | $(date '+%Y-%m-%d %H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
        echo "| 分支 | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 提交 | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f woniu_api_test/reports/test-results.xml ]; then
          echo "### 测试统计" >> $GITHUB_STEP_SUMMARY
          TESTS=$(grep -o 'tests="[0-9]*"' woniu_api_test/reports/test-results.xml | head -1 | grep -o '[0-9]*')
          FAILURES=$(grep -o 'failures="[0-9]*"' woniu_api_test/reports/test-results.xml | head -1 | grep -o '[0-9]*')
          ERRORS=$(grep -o 'errors="[0-9]*"' woniu_api_test/reports/test-results.xml | head -1 | grep -o '[0-9]*')
          SKIPPED=$(grep -o 'skipped="[0-9]*"' woniu_api_test/reports/test-results.xml | head -1 | grep -o '[0-9]*')
          echo "- 总用例数: ${TESTS:-0}" >> $GITHUB_STEP_SUMMARY
          echo "- 失败: ${FAILURES:-0}" >> $GITHUB_STEP_SUMMARY
          echo "- 错误: ${ERRORS:-0}" >> $GITHUB_STEP_SUMMARY
          echo "- 跳过: ${SKIPPED:-0}" >> $GITHUB_STEP_SUMMARY
        fi

  # 测试失败时发送通知
  notify:
    runs-on: ubuntu-latest
    needs: test
    if: failure()
    steps:
    - name: Send failure notification
      run: |
        echo "测试失败通知"
        echo "可以在这里配置钉钉/企微/邮件通知"
