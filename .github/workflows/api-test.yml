name: API Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  # 手动触发
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r woniu_api_test/requirements.txt

    - name: Run API tests
      working-directory: woniu_api_test
      run: |
        pytest -v --tb=short --junitxml=reports/test-results.xml
      continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: woniu_api_test/reports/test-results.xml

    - name: Post test summary
      if: always()
      run: |
        echo "## 测试结果摘要" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- 执行时间: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
        echo "- 分支: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- 提交: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # 测试失败时发送通知
  notify:
    runs-on: ubuntu-latest
    needs: test
    if: failure()
    steps:
    - name: Send failure notification
      run: |
        echo "测试失败通知"
        echo "可以在这里配置钉钉/企微/邮件通知"
