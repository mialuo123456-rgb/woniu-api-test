name: API Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  # 定时执行：每天凌晨 2 点（UTC）
  schedule:
    - cron: '0 18 * * *'  # UTC 18:00 = 北京时间凌晨 2:00
  # 手动触发
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r woniu_api_test/requirements.txt

    - name: Run API tests
      working-directory: woniu_api_test
      run: |
        pytest --alluredir=reports/allure-results -v --tb=short
      continue-on-error: true

    - name: Get Allure history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Allure Report Action
      uses: simple-elf/allure-report-action@v1.7
      if: always()
      with:
        allure_results: woniu_api_test/reports/allure-results
        allure_history: allure-history
        keep_reports: 20

    - name: Deploy report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history

    - name: Post test summary
      if: always()
      run: |
        echo "## 测试结果摘要" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- 🕐 执行时间: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
        echo "- 📊 报告地址: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY

  # 失败时发送通知（可选）
  notify:
    runs-on: ubuntu-latest
    needs: test
    if: failure()
    steps:
    - name: Send failure notification
      run: |
        echo "测试失败，可以在这里添加钉钉/企微/邮件通知"
        # 示例：curl 发送钉钉机器人消息
        # curl -X POST "https://oapi.dingtalk.com/robot/send?access_token=xxx" \
        #   -H "Content-Type: application/json" \
        #   -d '{"msgtype":"text","text":{"content":"API测试失败，请检查！"}}'
